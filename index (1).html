  .btn.small{padding:7px 12px;font-size:.76rem}

function buildInitial(){
  const now = Date.now();
  const cams = [];
  let id = 1;
  NOMES_IP.forEach(([n,p,local],i) => {
    cams.push({id:id++, n, ip:`192.168.1.${20+i}`, t:'IP', s:'ok', p, mod:'ONVIF', local, statusSince:now});
  });
  NOMES_ANALOG.forEach(([n,p,local]) => {
    cams.push({id:id++, n, ip:'', t:'Analogica', s:'ok', p, mod:'', local, statusSince:now});
  });
  const shuffled = [...cams].sort(()=>Math.random()-0.5);
  shuffled.slice(0,78).forEach(c => {
    const idx = cams.findIndex(x=>x.id===c.id);
    cams[idx].s = 'Parada';
    cams[idx].statusSince = now - (Math.random()*72+1)*3600000;
  });
  return cams;
}

function timeAgo(ts){if(!ts)return '';const d=Date.now()-ts;const m=Math.floor(d/60000);const h=Math.floor(m/60);const dy=Math.floor(h/24);if(dy>0)return `há ${dy}d ${h%24}h`;if(h>0)return `há ${h}h ${m%60}min`;if(m>0)return `há ${m}min`;return 'agora';}
function formatDateTime(ts){if(!ts)return '—';return new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function getDurationHours(ts){if(!ts)return 0;return (Date.now()-ts)/3600000;}

function useLS(key, initial){
  const [v, setV] = useState(()=>{
    try{
      const s = localStorage.getItem(key);
      return s ? JSON.parse(s) : (typeof initial === 'function' ? initial() : initial);
    }catch{ return typeof initial === 'function' ? initial() : initial; }
  });
  useEffect(()=>{ try{ localStorage.setItem(key, JSON.stringify(v)); }catch{} },[key,v]);
  return [v, setV];
}

  const notify = (msg, type='success') => {
    setToast({msg, type});
    setTimeout(()=>setToast({msg:'', type:'success'}), 3000);
  };

  const addLog = (msg) => setLog(prev => [{id:Date.now()+Math.random(), time:Date.now(), msg}, ...prev].slice(0,300));

  const toggleCamera = (id) => {
    setCameras(prev => prev.map(c => {
      if (c.id !== id) return c;
      const novo = c.s.toLowerCase()==='ok' ? 'Parada' : 'ok';
      addLog(`${novo==='ok'?'🟢 LIGADA':'🔴 DESLIGADA'}: ${c.n}`);
      notify(`${c.n} → ${novo==='ok'?'Ligada':'Desligada'}`, novo==='ok'?'success':'error');
      return {...c, s:novo, statusSince: Date.now()};
    }));
  };

  const saveCamera = (data) => {
    if (modal.mode === 'add') {
      const newId = Math.max(0, ...cameras.map(c=>c.id)) + 1;
      const nova = {...data, id:newId, statusSince:Date.now()};
      setCameras(prev => [...prev, nova]);
      addLog(`➕ ADICIONADA: ${nova.n}`);
      notify('Câmera adicionada!');
    } else {
      setCameras(prev => prev.map(c => {
        if (c.id !== modal.camera.id) return c;
        const mudou = c.s !== data.s;
        addLog(`✏️ EDITADA: ${data.n}`);
        return {...c, ...data, statusSince: mudou ? Date.now() : c.statusSince};
      }));
      notify('Câmera atualizada!');
    }
    setModal(null);
  };

  const deleteCamera = (id) => {
    const cam = cameras.find(c=>c.id===id);
    if (!confirm(`Remover "${cam.n}"?`)) return;
    setCameras(prev => prev.filter(c=>c.id!==id));
    addLog(`🗑️ REMOVIDA: ${cam.n}`);
    notify('Câmera removida','info');
  };

  const resetAll = () => {
    if (!confirm('Restaurar dados com 78 câmeras off-line?')) return;
    setCameras(buildInitial());
    setLog([]);
    notify('Dados restaurados!','info');
  };

  const exportCSV = () => {
    const headers = ['ID','Nome','Tipo','Status','Piso','IP','Modelo','Local','Desde'];
    const rows = cameras.map(c => [
      c.id, `"${c.n}"`, c.t, c.s, c.p||'', c.ip||'', c.mod||'', c.local||'',
      c.s.toLowerCase()==='ok'?'—':formatDateTime(c.statusSince)
    ].join(','));
    const csv = [headers.join(','), ...rows].join('\n');
    const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `cftv_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    notify('CSV exportado!');
  };

  const metrics = useMemo(()=>{
    const total = cameras.length;
    const online = cameras.filter(c=>c.s.toLowerCase()==='ok').length;
    const offline = total - online;
    const ip = cameras.filter(c=>c.t==='IP').length;
    const analog = total - ip;
    return {total, online, offline, ip, analog};
  },[cameras]);

  const filtered = useMemo(()=>{
    return cameras.filter(c => {
      if (filter==='IP' && c.t!=='IP') return false;
      if (filter==='Analogica' && c.t!=='Analogica') return false;
      if (filter==='offline' && c.s.toLowerCase()!=='parada') return false;
      if (filter==='online' && c.s.toLowerCase()!=='ok') return false;
      if (filter==='critical' && !(c.s.toLowerCase()==='parada' && getDurationHours(c.statusSince)>24)) return false;
      if (floorFilter!=='all' && (c.p||'Sem piso')!==floorFilter) return false;
      if (search) {
        const q = search.toLowerCase();
        if (!c.n.toLowerCase().includes(q) && !(c.ip||'').includes(q)
            && !(c.mod||'').toLowerCase().includes(q)
            && !(c.local||'').toLowerCase().includes(q)) return false;
      }
      const legendActive = Object.entries(legendFilters).filter(([k,v])=>v).map(([k])=>k);
      if (legendActive.length > 0) {
        let match = false;
        if (legendFilters.ip && c.t==='IP') match = true;
        if (legendFilters.analog && c.t==='Analogica') match = true;
        if (legendFilters.online && c.s.toLowerCase()==='ok') match = true;
        if (legendFilters.offline && c.s.toLowerCase()==='parada') match = true;
        if (!match) return false;
      }
      return true;
    });
  },[cameras, filter, search, floorFilter, legendFilters]);

  const allFloors = useMemo(()=>{
    const s = new Set(cameras.map(c => c.p && c.p.trim() ? c.p : 'Sem piso'));
    return Array.from(s).sort();
  },[cameras]);

  const toggleLegend = (key) => setLegendFilters(prev => ({...prev, [key]: !prev[key]}));

  return (
    <div className="container">
      <div className="top-block">
        <div className="header">
          <h1><span className="badge">🎥</span> CFTV • Monitoramento Operacional</h1>
          <div className="actions">
            <div className="clock"><span className="pulse-dot"></span>{now.toLocaleTimeString('pt-BR')}</div>
            <button className="btn green" onClick={()=>setModal({mode:'add'})}>+ Nova Câmera</button>
            <button className="btn" onClick={exportCSV}>⬇ CSV</button>
            <button className="btn red" onClick={resetAll}>↺ Restaurar</button>
          </div>
        </div>
        <div className="kpis">
          <div className="kpi" onClick={()=>{setFilter('all');setFloorFilter('all');setLegendFilters({ip:false,analog:false,online:false,offline:false});}}>
            <div className="kpi-label">Total</div>
            <div className="kpi-value">{metrics.total}</div>
            <small>Clique para ver todas</small>
          </div>
          <div className="kpi green" onClick={()=>{setFilter('online');setLegendFilters({ip:false,analog:false,online:false,offline:false});}}>
            <div className="kpi-label">Online</div>
            <div className="kpi-value">{metrics.online}</div>
            <small>{((metrics.online/metrics.total)*100).toFixed(1)}% operacionais</small>
          </div>
          <div className="kpi red" onClick={()=>{setFilter('offline');setLegendFilters({ip:false,analog:false,online:false,offline:false});}}>
            <div className="kpi-label">Off-line</div>
            <div className="kpi-value">{metrics.offline}</div>
            <small>{((metrics.offline/metrics.total)*100).toFixed(1)}% com falha</small>
          </div>
          <div className="kpi amber" onClick={()=>{setFilter('critical');setLegendFilters({ip:false,analog:false,online:false,offline:false});}}>
            <div className="kpi-label">⚠️ Críticas +24h</div>
            <div className="kpi-value">{cameras.filter(c=>c.s.toLowerCase()==='parada'&&getDurationHours(c.statusSince)>24).length}</div>
            <small>Off-line há mais de 24h</small>
          </div>
          <div className="kpi purple">
            <div className="kpi-label">📜 Eventos</div>
            <div className="kpi-value">{log.length}</div>
            <small>Histórico</small>
          </div>
        </div>
      </div>

      <div className="legend-box">
        <span className="legend-title">Legenda:</span>
        <button className={`legend-item ${legendFilters.ip?'active':''}`} onClick={()=>toggleLegend('ip')}>
          <span className="dot ip"></span> IP <span className="count">{metrics.ip}</span>
        </button>
        <button className={`legend-item ${legendFilters.analog?'active':''}`} onClick={()=>toggleLegend('analog')}>
          <span className="dot analog"></span> Analógica <span className="count">{metrics.analog}</span>
        </button>
        <button className={`legend-item ${legendFilters.online?'active':''}`} onClick={()=>toggleLegend('online')}>
          <span className="dot online"></span> Online <span className="count">{metrics.online}</span>
        </button>
        <button className={`legend-item ${legendFilters.offline?'active':''}`} onClick={()=>toggleLegend('offline')}>
          <span className="dot offline"></span> Off-line <span className="count">{metrics.offline}</span>
        </button>
      </div>

      <div className="toolbar-box">
        <div className="toolbar">
          <input className="search" placeholder="🔍 Buscar..." value={search} onChange={e=>setSearch(e.target.value)} />
          <button className={`btn small ${filter==='all'?'active':''}`} onClick={()=>setFilter('all')}>Todas</button>
          <button className={`btn small ${filter==='online'?'active':''}`} onClick={()=>setFilter('online')}>🟢 Online</button>
          <button className={`btn small ${filter==='offline'?'active':''}`} onClick={()=>setFilter('offline')}>🔴 Off-line</button>
          <button className={`btn small ${filter==='critical'?'active':''}`} onClick={()=>setFilter('critical')}>⚠️ +24h</button>
          <select className="search" style={{maxWidth:160}} value={floorFilter} onChange={e=>setFloorFilter(e.target.value)}>
            <option value="all">Todos os pisos</option>
            {allFloors.map(f=><option key={f} value={f}>{f}</option>)}
          </select>
        </div>
      </div>

      <div className="table-box">
        <div className="table-scroll">
          <table>
            <thead><tr>
              <th style={{width:60}}>Ligar</th>
              <th>Nome da Câmera</th>
              <th>Tipo</th>
              <th>Piso</th>
              <th>Local</th>
              <th>IP</th>
              <th>Status</th>
              <th>Desde</th>
              <th>Tempo</th>
              <th style={{width:80}}>Ações</th>
            </tr></thead>
            <tbody>
              {filtered.length===0 ? (
                <tr><td colSpan="10" className="empty">Nenhuma câmera encontrada</td></tr>
              ) : filtered.map(c => {
                const online = c.s.toLowerCase()==='ok';
                const horas = getDurationHours(c.statusSince);
                let offClass = 'offtime';
                if (horas > 72) offClass += ' critical';
                else if (horas > 24) offClass += ' long';
                const isCritical = !online && horas > 24;
                return (
                  <tr key={c.id} className={isCritical ? 'row-alert' : ''}>
                    <td><div className={`toggle ${online?'on':''}`} onClick={()=>toggleCamera(c.id)}></div></td>
                    <td><div style={{fontWeight:600}}>{c.n}</div></td>
                    <td><span className={`badge ${c.t==='IP'?'ip':'analog'}`}>{c.t}</span></td>
                    <td>{c.p ? <span className="piso">{c.p}</span> : '—'}</td>
                    <td className="info-cell">{c.local||'—'}</td>
                    <td className="info-cell">{c.ip||'—'}</td>
                    <td><span className={`badge ${online?'ok':'bad'}`}>{online?'● Online':'● Off-line'}</span></td>
                    <td className="info-cell">{online?'—':formatDateTime(c.statusSince)}</td>
                    <td className={offClass}>{online?'—':timeAgo(c.statusSince)}</td>
                    <td>
                      <button className="btn-icon" onClick={()=>setModal({mode:'edit',camera:c})}>✏️</button>
                      <button className="btn-icon del" onClick={()=>deleteCamera(c.id)}>🗑️</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      <div className="footer">
        💾 Dados salvos no navegador • {cameras.length} câmeras • {metrics.offline} off-line • {log.length} eventos
      </div>

      {modal && <CameraModal camera={modal.camera} onSave={saveCamera} onClose={()=>setModal(null)} />}

      {toast.msg && (
        <div className={`toast show ${toast.type}`}>
          {toast.type==='success'?'✅ ':toast.type==='error'?'🔴 ':'ℹ️ '}{toast.msg}
        </div>
      )}
    </div>
  );
}

function CameraModal({camera, onSave, onClose}){
  const [form, setForm] = useState(camera ? {
    n: camera.n, t: camera.t, s: camera.s, p: camera.p,
    ip: camera.ip, mod: camera.mod, local: camera.local
  } : {n:'', t:'IP', s:'ok', p:'', ip:'', mod:'', local:''});

  const submit = (e) => {
    e.preventDefault();
    if (!form.n.trim()) return alert('Digite um nome');
    onSave(form);
  };

  return (
    <div className="modal-bg show" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h2>{camera?'✏️ Editar Câmera':'➕ Nova Câmera'}</h2>
        <form onSubmit={submit}>
          <div className="form-group"><label>Nome</label>
            <input value={form.n} onChange={e=>setForm({...form,n:e.target.value})} autoFocus /></div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            <div className="form-group"><label>Tipo</label>
              <select value={form.t} onChange={e=>setForm({...form,t:e.target.value})}>
                <option value="IP">IP</option><option value="Analogica">Analógica</option>
              </select></div>
            <div className="form-group"><label>Status</label>
              <select value={form.s} onChange={e=>setForm({...form,s:e.target.value})}>
                <option value="ok">Online</option><option value="Parada">Off-line</option>
              </select></div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            <div className="form-group"><label>Piso</label>
              <input value={form.p} onChange={e=>setForm({...form,p:e.target.value})} /></div>
            <div className="form-group"><label>Local</label>
              <input value={form.local} onChange={e=>setForm({...form,local:e.target.value})} /></div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            <div className="form-group"><label>IP</label>
              <input value={form.ip} onChange={e=>setForm({...form,ip:e.target.value})} /></div>
            <div className="form-group"><label>Modelo</label>
              <input value={form.mod} onChange={e=>setForm({...form,mod:e.target.value})} /></div>
          </div>
          <div className="modal-actions">
            <button type="button" className="btn" onClick={onClose}>Cancelar</button>
            <button type="submit" className="btn green">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
