<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFTV • Monitoramento Operacional</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{
    --bg:#0a0f1a; --bg2:#0f172a; --card:#1e293b; --card2:#1e293bcc;
    --border:rgba(148,163,184,.12); --border2:rgba(148,163,184,.2);
    --text:#f1f5f9; --text2:#cbd5e1; --text3:#94a3b8; --text4:#64748b;
    --blue:#3b82f6; --blue2:#60a5fa; --purple:#8b5cf6; --purple2:#a78bfa;
    --green:#22c55e; --green2:#4ade80; --red:#ef4444; --red2:#f87171;
    --amber:#f59e0b; --amber2:#fbbf24; --cyan:#06b6d4; --cyan2:#22d3ee;
    --pink:#ec4899; --pink2:#f472b6;
    --grad1:linear-gradient(135deg,#3b82f6,#8b5cf6);
    --shadow:0 8px 24px -8px rgba(0,0,0,.3);
  }
  [data-theme="light"]{
    --bg:#f1f5f9; --bg2:#e2e8f0; --card:#ffffff; --card2:#ffffffdd;
    --border:rgba(15,23,42,.08); --border2:rgba(15,23,42,.15);
    --text:#0f172a; --text2:#1e293b; --text3:#475569; --text4:#64748b;
    --shadow:0 8px 24px -8px rgba(0,0,0,.08);
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}

  /* LAYOUT */
  .app{display:flex;min-height:100vh}
  .sidebar{width:250px;background:var(--card);border-right:1px solid var(--border);
    display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:100;
    transition:width .3s, transform .3s, background .3s}
  .sidebar.collapsed{width:70px}
  .sidebar.collapsed .nav-label,
  .sidebar.collapsed .logo-text,
  .sidebar.collapsed .sidebar-footer-text{display:none}
  .sidebar.collapsed .nav-item{justify-content:center;padding:12px 0}
  .sidebar.collapsed .nav-item i{font-size:1.2rem;margin:0}

  .logo{display:flex;align-items:center;gap:12px;padding:20px;border-bottom:1px solid var(--border)}
  .logo-icon{width:42px;height:42px;background:var(--grad1);border-radius:12px;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.1rem;flex-shrink:0;
    box-shadow:0 8px 20px -6px rgba(59,130,246,.5)}
  .logo-text{font-weight:800;font-size:1rem;
    background:var(--grad1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;line-height:1.2}
  .logo-text small{display:block;font-size:.62rem;color:var(--text3);
    -webkit-text-fill-color:var(--text3);font-weight:600;letter-spacing:.1em;margin-top:2px}

  .nav{flex:1;padding:16px 12px;overflow-y:auto}
  .nav-item{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:12px;
    color:var(--text3);font-weight:600;font-size:.88rem;cursor:pointer;
    transition:all .2s;margin-bottom:4px;font-family:inherit;background:none;border:none;width:100%;text-align:left}
  .nav-item:hover{background:rgba(59,130,246,.1);color:var(--text)}
  .nav-item.active{background:var(--grad1);color:#fff;
    box-shadow:0 8px 20px -6px rgba(59,130,246,.5)}
  .nav-item i{width:20px;text-align:center;font-size:1rem}
  .nav-label{flex:1}
  .nav-count{background:rgba(0,0,0,.3);padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:700}
  .nav-item.active .nav-count{background:rgba(255,255,255,.25)}

  .sidebar-footer{padding:12px;border-top:1px solid var(--border);
    display:flex;align-items:center;gap:10px;cursor:pointer;
    border-radius:12px;margin:6px;transition:background .2s}
  .sidebar-footer:hover{background:rgba(59,130,246,.1)}
  .theme-toggle{width:38px;height:38px;border-radius:10px;background:rgba(59,130,246,.15);
    display:flex;align-items:center;justify-content:center;color:var(--blue2);font-size:1rem}

  /* MAIN */
  .main{flex:1;margin-left:250px;transition:margin-left .3s;padding:24px;
    min-height:100vh;background:var(--bg)}
  .main.expanded{margin-left:70px}

  .topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;
    flex-wrap:wrap;margin-bottom:24px;animation:slideDown .4s ease}
  @keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

  .breadcrumb{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--text3);
    font-weight:600}
  .breadcrumb .sep{color:var(--text4);font-size:.7rem}
  .breadcrumb .current{color:var(--blue2)}

  .topbar-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{background:var(--card);border:1px solid var(--border2);color:var(--text2);
    padding:9px 16px;border-radius:10px;font-weight:600;font-size:.83rem;cursor:pointer;
    transition:all .2s;font-family:inherit;display:inline-flex;align-items:center;gap:8px;
    box-shadow:var(--shadow)}
  .btn:hover{border-color:var(--blue);color:var(--blue2);transform:translateY(-1px)}
  .btn.primary{background:var(--grad1);border-color:transparent;color:#fff}
  .btn.primary:hover{color:#fff;transform:translateY(-2px);box-shadow:0 10px 24px -8px rgba(59,130,246,.6)}
  .btn.danger{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:var(--red2)}
  .btn.danger:hover{border-color:var(--red);color:#fff;background:var(--red)}

  .clock{background:var(--card);padding:10px 16px;border-radius:10px;font-weight:600;
    font-size:.85rem;border:1px solid var(--border2);color:var(--text2);
    display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
  .pulse-dot{width:8px;height:8px;background:var(--green2);border-radius:50%;
    animation:pulse 2s infinite;flex-shrink:0}
  .pulse-dot.syncing{background:var(--amber2);animation:pulse .8s infinite}
  .pulse-dot.error{background:var(--red2);animation:none}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}

  /* KPIs */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:18px;position:relative;cursor:pointer;transition:all .3s;overflow:hidden;
    animation:fadeUp .4s ease backwards}
  .kpi:nth-child(1){animation-delay:.05s}
  .kpi:nth-child(2){animation-delay:.1s}
  .kpi:nth-child(3){animation-delay:.15s}
  .kpi:nth-child(4){animation-delay:.2s}
  .kpi:nth-child(5){animation-delay:.25s}
  .kpi:nth-child(6){animation-delay:.3s}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .kpi:hover{transform:translateY(-4px);border-color:var(--blue);box-shadow:0 15px 30px -10px rgba(59,130,246,.3)}
  .kpi::before{content:'';position:absolute;left:0;top:0;width:4px;height:100%;
    background:var(--grad1)}
  .kpi.red::before{background:linear-gradient(180deg,var(--red),var(--amber))}
  .kpi.green::before{background:linear-gradient(180deg,var(--green),var(--green2))}
  .kpi.amber::before{background:linear-gradient(180deg,var(--amber),var(--red))}
  .kpi.purple::before{background:linear-gradient(180deg,var(--purple),var(--pink))}
  .kpi.blue::before{background:linear-gradient(180deg,var(--blue),var(--cyan))}
  .kpi.cyan::before{background:linear-gradient(180deg,var(--cyan),var(--blue))}
  .kpi-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
  .kpi-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;
    color:var(--text3);font-weight:700}
  .kpi-icon{width:38px;height:38px;border-radius:10px;background:rgba(59,130,246,.15);
    display:flex;align-items:center;justify-content:center;color:var(--blue2);font-size:.9rem}
  .kpi.red .kpi-icon{background:rgba(239,68,68,.15);color:var(--red2)}
  .kpi.green .kpi-icon{background:rgba(34,197,94,.15);color:var(--green2)}
  .kpi.amber .kpi-icon{background:rgba(245,158,11,.15);color:var(--amber2)}
  .kpi.purple .kpi-icon{background:rgba(139,92,246,.15);color:var(--purple2)}
  .kpi.cyan .kpi-icon{background:rgba(6,182,212,.15);color:var(--cyan2)}
  .kpi-value{font-size:2rem;font-weight:800;color:var(--text);line-height:1;
    letter-spacing:-.02em}
  .kpi.red .kpi-value{color:var(--red2)}
  .kpi.green .kpi-value{color:var(--green2)}
  .kpi.amber .kpi-value{color:var(--amber2)}
  .kpi small{font-size:.68rem;color:var(--text4);display:block;margin-top:6px;font-weight:500}

  /* CHARTS */
  .charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:16px;margin-bottom:24px;animation:fadeUp .5s ease backwards;animation-delay:.35s}
  .chart-card{background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:20px;box-shadow:var(--shadow)}
  .chart-title{font-weight:700;font-size:.95rem;margin-bottom:16px;color:var(--text);
    display:flex;align-items:center;gap:10px}
  .chart-title i{color:var(--blue2)}
  .chart-box{position:relative;height:220px}

  /* TABS/VIEWS */
  .view{display:none;animation:fadeUp .35s ease}
  .view.active{display:block}

  /* TOOLBAR */
  .toolbar-box{background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input.search,select.search{background:var(--bg2);border:1px solid var(--border2);
    padding:10px 14px;border-radius:10px;color:var(--text);font-size:.85rem;
    outline:none;font-family:inherit;transition:border .2s}
  input.search:focus,select.search:focus{border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(59,130,246,.15)}
  input.search{flex:1;min-width:200px}
  .btn.small{padding:8px 14px;font-size:.78rem}

  /* TABELA */
  .table-box{background:var(--card);border:1px solid var(--border);border-radius:16px;
    overflow:hidden;margin-bottom:24px;box-shadow:var(--shadow)}
  .table-scroll{overflow-x:auto;max-height:70vh;overflow-y:auto}
  .table-scroll::-webkit-scrollbar{width:10px;height:10px}
  .table-scroll::-webkit-scrollbar-track{background:var(--bg2)}
  .table-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px}
  .table-scroll::-webkit-scrollbar-thumb:hover{background:var(--text4)}
  table{width:100%;border-collapse:collapse;font-size:.83rem}
  thead th{text-align:left;padding:14px 14px;font-size:.68rem;text-transform:uppercase;
    letter-spacing:.06em;color:var(--text3);background:var(--bg2);
    border-bottom:2px solid rgba(96,165,250,.2);white-space:nowrap;
    position:sticky;top:0;z-index:10;font-weight:700}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--border);color:var(--text2)}
  tbody tr{transition:background .15s}
  tbody tr:hover td{background:rgba(59,130,246,.05)}
  .row-alert{background:rgba(239,68,68,.06)!important}
  .piso{background:rgba(59,130,246,.15);color:var(--blue2);padding:4px 10px;
    border-radius:8px;font-weight:700;font-size:.72rem;display:inline-block}
  .badge{padding:4px 10px;border-radius:20px;font-size:.68rem;font-weight:700;
    display:inline-flex;align-items:center;gap:5px}
  .badge.ok{background:rgba(34,197,94,.15);color:var(--green2)}
  .badge.bad{background:rgba(239,68,68,.15);color:var(--red2)}
  .badge.ip{background:rgba(59,130,246,.15);color:var(--blue2)}
  .badge.analog{background:rgba(245,158,11,.15);color:var(--amber2)}
  .badge.eol{background:rgba(239,68,68,.25);color:#fca5a5}
  .badge.dup{background:rgba(239,68,68,.2);color:#fca5a5;font-size:.7rem}
  .badge.dvr{background:rgba(236,72,153,.15);color:var(--pink2)}
  .badge.nvr{background:rgba(34,211,238,.15);color:var(--cyan2)}
  .badge.srv{background:rgba(59,130,246,.15);color:var(--blue2)}

  .toggle{position:relative;width:48px;height:24px;background:var(--red);border-radius:20px;
    cursor:pointer;transition:.3s;display:inline-block}
  .toggle.on{background:var(--green)}
  .toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;
    background:#fff;border-radius:50%;transition:.3s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .toggle.on::after{left:27px}

  .offtime{font-size:.72rem;color:var(--red2);font-weight:600}
  .offtime.long{color:var(--amber2)}
  .offtime.critical{color:var(--red2);font-weight:800;animation:blink 2s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
  .empty{text-align:center;padding:40px;color:var(--text4)}
  .info-cell{font-size:.72rem;color:var(--text4)}

  /* EQUIPAMENTOS */
  .locais-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
    gap:16px;margin-bottom:24px}
  .local-card{background:var(--card);border:1px solid var(--border);border-radius:16px;
    overflow:hidden;transition:.3s;box-shadow:var(--shadow);animation:fadeUp .4s ease backwards}
  .local-card:hover{border-color:var(--blue);transform:translateY(-3px);
    box-shadow:0 15px 35px -12px rgba(59,130,246,.3)}
  .local-header{padding:16px 20px;background:linear-gradient(135deg,rgba(59,130,246,.12),rgba(139,92,246,.08));
    border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .local-title{display:flex;align-items:center;gap:10px;font-weight:700;font-size:.95rem;color:var(--text)}
  .local-count{font-size:.7rem;background:rgba(0,0,0,.25);padding:4px 10px;
    border-radius:20px;color:var(--text2);font-weight:700}
  .local-body{padding:16px 20px 18px}
  .local-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;
    padding-bottom:16px;border-bottom:1px solid var(--border)}
  .stat-box{text-align:center}
  .stat-box .num{font-size:1.2rem;font-weight:800;color:var(--text);line-height:1}
  .stat-box .lbl{font-size:.6rem;text-transform:uppercase;color:var(--text4);
    font-weight:700;letter-spacing:.05em;margin-top:4px}
  .stat-box.ok .num{color:var(--green2)}
  .stat-box.bad .num{color:var(--red2)}
  .equip-list{display:flex;flex-direction:column;gap:8px}
  .equip-item{display:flex;align-items:center;gap:12px;padding:10px 12px;
    background:var(--bg2);border-radius:10px;border-left:3px solid var(--blue);
    transition:.2s;cursor:default}
  .equip-item:hover{background:rgba(59,130,246,.08);transform:translateX(3px)}
  .equip-item.sw{border-left-color:var(--purple2)}
  .equip-item.dvr{border-left-color:var(--pink2)}
  .equip-item.nvr{border-left-color:var(--cyan2)}
  .equip-item.nob{border-left-color:#facc15}
  .equip-item.srv{border-left-color:var(--blue2)}
  .equip-item.mon{border-left-color:var(--text3)}
  .equip-item.eol{border-left-color:var(--red);background:rgba(239,68,68,.06)}
  .equip-icon{width:32px;height:32px;border-radius:8px;background:rgba(59,130,246,.15);
    display:flex;align-items:center;justify-content:center;color:var(--blue2);
    font-size:.85rem;flex-shrink:0}
  .equip-item.sw .equip-icon{background:rgba(139,92,246,.15);color:var(--purple2)}
  .equip-item.dvr .equip-icon{background:rgba(236,72,153,.15);color:var(--pink2)}
  .equip-item.nvr .equip-icon{background:rgba(34,211,238,.15);color:var(--cyan2)}
  .equip-item.nob .equip-icon{background:rgba(250,204,21,.15);color:#facc15}
  .equip-item.eol .equip-icon{background:rgba(239,68,68,.2);color:#fca5a5}
  .equip-info{flex:1;min-width:0}
  .equip-name{font-weight:600;font-size:.83rem;color:var(--text)}
  .equip-meta{font-size:.68rem;color:var(--text4);margin-top:3px;
    display:flex;gap:10px;flex-wrap:wrap}
  .equip-tag{font-size:.6rem;padding:3px 8px;border-radius:6px;font-weight:700;
    text-transform:uppercase;letter-spacing:.04em;flex-shrink:0}
  .equip-tag.sw{background:rgba(139,92,246,.2);color:var(--purple2)}
  .equip-tag.dvr{background:rgba(236,72,153,.2);color:var(--pink2)}
  .equip-tag.nvr{background:rgba(34,211,238,.2);color:var(--cyan2)}
  .equip-tag.nob{background:rgba(250,204,21,.2);color:#facc15}
  .equip-tag.srv{background:rgba(59,130,246,.2);color:var(--blue2)}
  .equip-tag.mon{background:rgba(148,163,184,.2);color:var(--text2)}

  /* GRAVADORES */
  .grav-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));
    gap:16px;margin-bottom:24px}
  .grav-card{background:var(--card);border:1px solid var(--border);border-radius:16px;
    overflow:hidden;transition:.3s;box-shadow:var(--shadow);animation:fadeUp .4s ease backwards}
  .grav-card:hover{border-color:var(--blue);box-shadow:0 15px 35px -12px rgba(59,130,246,.3)}
  .grav-header{padding:18px 22px;border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    cursor:pointer;user-select:none;transition:filter .2s}
  .grav-header.nvr{background:linear-gradient(135deg,rgba(34,211,238,.15),rgba(59,130,246,.1))}
  .grav-header.dvr{background:linear-gradient(135deg,rgba(236,72,153,.15),rgba(139,92,246,.1))}
  .grav-header.srv{background:linear-gradient(135deg,rgba(59,130,246,.15),rgba(139,92,246,.1))}
  .grav-header:hover{filter:brightness(1.15)}
  .grav-title{font-weight:800;font-size:1rem;color:var(--text);
    display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .grav-subtitle{font-size:.78rem;color:var(--text3);
    display:flex;flex-direction:column;gap:3px}
  .grav-subtitle code{font-family:'Courier New',monospace;color:var(--blue2);
    background:rgba(59,130,246,.1);padding:2px 8px;border-radius:5px;font-size:.75rem}
  .grav-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
    padding:14px 22px;border-bottom:1px solid var(--border);
    background:var(--bg2);cursor:pointer;user-select:none}
  .grav-stat{text-align:center}
  .grav-stat .num{font-size:1.4rem;font-weight:800;color:var(--text);line-height:1}
  .grav-stat .lbl{font-size:.6rem;text-transform:uppercase;color:var(--text4);
    font-weight:700;letter-spacing:.05em;margin-top:4px}
  .grav-stat.ok .num{color:var(--green2)}
  .grav-stat.bad .num{color:var(--red2)}
  .grav-cams{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 20px}
  .grav-card.expanded .grav-cams{max-height:800px;padding:14px 20px;overflow-y:auto}
  .grav-cam{display:flex;align-items:center;gap:12px;padding:9px 12px;
    border-radius:8px;background:var(--bg2);margin-bottom:6px;transition:.2s;
    border-left:3px solid var(--green);font-size:.8rem}
  .grav-cam.off{border-left-color:var(--red);background:rgba(239,68,68,.05)}
  .grav-cam:hover{background:rgba(59,130,246,.08)}
  .grav-cam .ch{font-family:'Courier New',monospace;font-weight:700;
    color:var(--text3);font-size:.72rem;min-width:36px;text-align:center;
    background:rgba(0,0,0,.2);padding:3px 7px;border-radius:5px}
  .grav-cam .name{flex:1;font-weight:600;color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grav-cam .ip{font-family:'Courier New',monospace;font-size:.7rem;color:var(--text4)}
  .grav-cam .status{font-size:.65rem;font-weight:700;padding:3px 9px;border-radius:10px}
  .grav-cam .status.on{background:rgba(34,197,94,.15);color:var(--green2)}
  .grav-cam .status.off{background:rgba(239,68,68,.15);color:var(--red2)}
  .grav-cam .status.virtual{background:rgba(148,163,184,.15);color:var(--text3)}
  .grav-chevron{margin-left:auto;color:var(--text3);font-size:.9rem;
    transition:transform .3s;flex-shrink:0}
  .grav-card.expanded .grav-chevron{transform:rotate(180deg)}
  .grav-hint{font-size:.68rem;color:var(--text4);text-align:center;
    padding:8px 0;border-top:1px dashed var(--border);margin-top:8px}
  .grav-empty{padding:40px;text-align:center;color:var(--text4);font-size:.85rem}

  /* AUDITORIA */

  .audit-header{padding:16px 20px;display:flex;justify-content:space-between;

  .audit-header.blue{background:linear-gradient(135deg,rgba(59,130,246,.15),rgba(139,92,246,.1))}

    display:flex;align-items:center;gap:8px}
  .audit-count{background:rgba(0,0,0,.3);padding:4px 12px;border-radius:20px;
    font-size:.72rem;font-weight:700;color:#fff}
  .audit-body{padding:14px 18px;max-height:400px;overflow-y:auto}
  .audit-body::-webkit-scrollbar{width:6px}
  .audit-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
  .audit-item{padding:12px 14px;background:var(--bg2);border-radius:10px;
    margin-bottom:8px;border-left:3px solid var(--blue)}
  .audit-item.red{border-left-color:var(--red)}
  .audit-item.amber{border-left-color:var(--amber)}
  .audit-item-title{font-weight:600;font-size:.83rem;color:var(--text);margin-bottom:5px}
  .audit-item-detail{font-size:.73rem;color:var(--text3);
    display:flex;flex-direction:column;gap:3px}
  .audit-item-detail span{padding:2px 0}
  .audit-empty{padding:30px;text-align:center;color:var(--green2);font-size:.85rem}

  /* FOOTER */
  .footer{text-align:center;padding:24px 0 12px;color:var(--text4);
    font-size:.76rem;border-top:1px solid var(--border);margin-top:24px}

  /* TOAST */
  .toast{position:fixed;bottom:24px;right:24px;background:var(--card);
    border:1px solid var(--green);color:var(--green2);padding:14px 22px;
    border-radius:12px;font-weight:600;font-size:.85rem;z-index:9999;
    display:none;max-width:340px;box-shadow:0 20px 40px rgba(0,0,0,.4)}
  .toast.show{display:block;animation:slideIn .3s ease}
  .toast.error{border-color:var(--red);color:var(--red2)}
  .toast.info{border-color:var(--blue);color:var(--blue2)}
  @keyframes slideIn{from{transform:translateX(400px);opacity:0}to{transform:translateX(0);opacity:1}}

  /* MOBILE */
  .menu-toggle{display:none;background:var(--card);border:1px solid var(--border2);
    color:var(--text);width:42px;height:42px;border-radius:10px;cursor:pointer;
    align-items:center;justify-content:center;font-size:1rem}

    .sidebar.mobile-open{transform:translateX(0)}
    .main{margin-left:0}
    .menu-toggle{display:flex}
    .kpi-value{font-size:1.5rem}
    .grav-grid,.locais-grid{grid-template-columns:1fr}
  }

  /* NOTIFICAÇÃO DE ATALHO */
  .shortcut-hint{position:fixed;bottom:24px;left:24px;background:var(--card);
    border:1px solid var(--border2);padding:10px 14px;border-radius:10px;
    font-size:.75rem;color:var(--text3);box-shadow:var(--shadow);
    display:flex;gap:12px;align-items:center;opacity:0;pointer-events:none;
    transition:.3s;z-index:50}
  .shortcut-hint.show{opacity:1}
  .shortcut-hint kbd{background:var(--bg2);border:1px solid var(--border2);
    padding:2px 8px;border-radius:6px;font-family:monospace;font-size:.7rem;
    color:var(--blue2);font-weight:700}

function setSyncStatus(s){
  const dot = document.querySelector('#syncStatus .pulse-dot');
  dot.classList.remove('syncing','error');
  if(s === 'syncing') dot.classList.add('syncing');
  else if(s === 'error') dot.classList.add('error');
}

async function carregarDoGitHub(){
  setSyncStatus('syncing');
  document.getElementById('syncInfo').textContent = '🔄 Carregando cameras.json...';
  try{
    const res = await fetch(`${LOCAL_JSON_URL}?t=${Date.now()}`);
    if(res.ok){
      cameras = await res.json();
      if(!Array.isArray(cameras) || cameras.length === 0){
        cameras = buildInitial();
        await salvarNoGitHub();
      }
      lastSyncTime = new Date();
      setSyncStatus('ok');
      document.getElementById('syncInfo').textContent = `✅ Carregado (${lastSyncTime.toLocaleTimeString('pt-BR')})`;
      return;
    }
    cameras = buildInitial();
    await salvarNoGitHub();
    setSyncStatus('ok');
    document.getElementById('syncInfo').textContent = '✅ Arquivo criado';
  }catch(e){
    console.error(e);
    carregarLocal();
    setSyncStatus('error');
    document.getElementById('syncInfo').textContent = '⚠️ Usando cópia local';
  }
}

async function salvarNoGitHub(){
  if(syncing) return;
  syncing = true;
  setSyncStatus('syncing');
  try{
    const res = await fetch(LOCAL_SAVE_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(cameras)
    });
    if(!res.ok) throw new Error(`Servidor ${res.status}`);
    lastSyncTime = new Date();
    setSyncStatus('ok');
    document.getElementById('syncInfo').textContent = `💾 Salvo em cameras.json (${lastSyncTime.toLocaleTimeString('pt-BR')})`;
    salvarLocal();
  }catch(e){
    console.error(e);
    setSyncStatus('error');
    document.getElementById('syncInfo').textContent = `⚠️ Erro: ${e.message}`;
    salvarLocal();
  }finally{ syncing = false; }
}

function salvarLocal(){ try{ localStorage.setItem(FALLBACK_KEY, JSON.stringify(cameras)); }catch(e){} }

// ============================================================
// BUILD
// ============================================================
function buildInitial(){
  const now = Date.now();
  const cams = [];
  let id = 1;
  NOMES_IP.forEach(([n,p,local],i) => {
    cams.push({id:id++, n, ip:`192.168.1.${20+i}`, t:'IP', s:'ok', p, mod:'ONVIF', local, statusSince:now});
  });
  NOMES_ANALOG.forEach(([n,p,local]) => {
    cams.push({id:id++, n, ip:'', t:'Analogica', s:'ok', p, mod:'', local, statusSince:now});
  });
  while(cams.length < TOTAL_CAMERAS){
    const idx = cams.length + 1;
    const piso = ['C','M','L','G','T'][idx % 5];
    cams.push({id:id++, n:`Câmera Extra ${idx}`, ip:`192.168.1.${200 + (idx % 50)}`,
      t: idx % 3 === 0 ? 'Analogica' : 'IP', s:'ok', p:piso,
      mod: idx % 3 === 0 ? '' : 'ONVIF',
      local: piso === 'C' ? 'Piso C' : piso === 'L' ? 'Sala de Segurança' : 'Shaft 1º Andar',
      statusSince: now});
  }
  cams.splice(TOTAL_CAMERAS);
  const shuffled = [...cams].sort(()=>Math.random()-0.5);
  shuffled.slice(0, TOTAL_OFF).forEach(c => {
    const idx = cams.findIndex(x=>x.id===c.id);
    cams[idx].s = 'Parada';
    cams[idx].statusSince = now - (Math.random()*72+1)*3600000;
  });
  return cams;
}

// ============================================================
// HELPERS
// ============================================================
function timeAgo(ts){
  if(!ts) return '';
  const d = Date.now()-ts, m = Math.floor(d/60000), h = Math.floor(m/60), dy = Math.floor(h/24);
  if(dy>0) return `há ${dy}d ${h%24}h`;
  if(h>0) return `há ${h}h ${m%60}min`;
  if(m>0) return `há ${m}min`;
  return 'agora';
}
function fmtDT(ts){ if(!ts) return '—'; return new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function durH(ts){ return ts ? (Date.now()-ts)/3600000 : 0; }
function escapeHtml(s){ return s==null ? '' : String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function normalizeStr(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\s_\-\.]/g,''); }
function toast(msg, type='success'){
  const el = document.getElementById('toast');
  el.textContent = (type==='success'?'✅ ':type==='error'?'🔴 ':'ℹ️ ') + msg;
  el.className = 'toast show' + (type!=='success' ? ' '+type : '');
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.className = 'toast'; }, 2500);
}

function exportarCSV(){
  const headers = ['ID','Nome','Tipo','Status','Piso','IP','Modelo','Local','Desde'];
  const rows = cameras.map(c => [
    c.id, `"${c.n}"`, c.t, c.s, c.p||'', c.ip||'', c.mod||'', c.local||'',
    c.s.toLowerCase()==='ok'?'':fmtDT(c.statusSince)
  ].join(','));
  const csv = [headers.join(','), ...rows].join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `cftv_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  toast('CSV exportado!');
}

// ============================================================
// AUDITORIA
// ============================================================
function auditar(){
  const duplicatasIP = {}, nomesNorm = {}, semIP = [], semPiso = [], semLocal = [], ipsInvalidos = [];
  cameras.forEach(c => {
    if(c.ip && c.ip.trim()){
      if(!duplicatasIP[c.ip]) duplicatasIP[c.ip] = [];
      duplicatasIP[c.ip].push(c);
      if(!/^192\.168\.\d{1,3}\.\d{1,3}$/.test(c.ip)) ipsInvalidos.push(c);
    } else semIP.push(c);
    const norm = normalizeStr(c.n);
    if(!nomesNorm[norm]) nomesNorm[norm] = [];
    nomesNorm[norm].push(c);
    if(!c.p || !c.p.trim()) semPiso.push(c);
    if(!c.local || !c.local.trim()) semLocal.push(c);
  });
  const ipsDuplicados = Object.entries(duplicatasIP).filter(([k,v])=>v.length>1);
  const nomesDuplicados = Object.entries(nomesNorm).filter(([k,v])=>v.length>1);
  return {
    ipsDuplicados, nomesDuplicados, semIP, semPiso, semLocal, ipsInvalidos,
    totalProblemas: ipsDuplicados.length + nomesDuplicados.length + semIP.length + semPiso.length + semLocal.length + ipsInvalidos.length
  };
}

// ============================================================
function getFiltered(){
  return cameras.filter(c => {
    if(filter==='offline' && c.s.toLowerCase()!=='parada') return false;
    if(filter==='online' && c.s.toLowerCase()!=='ok') return false;
    if(floorFilter!=='all' && (c.p||'Sem piso')!==floorFilter) return false;
    if(search){
      const q = search.toLowerCase();
      if(!c.n.toLowerCase().includes(q) && !(c.ip||'').includes(q)
          && !(c.mod||'').toLowerCase().includes(q)
          && !(c.local||'').toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function renderGravadores(){
  const grid = document.getElementById('gravGrid');
  const camMap = {};
  cameras.forEach(c => { camMap[c.n.toLowerCase()] = c; });

  let gravs = GRAVADORES.slice();
  if(gravFilter !== 'all') gravs = gravs.filter(g => g.tipo.toLowerCase() === gravFilter);
  if(gravSearch){
    const q = gravSearch.toLowerCase();
    gravs = gravs.filter(g =>
      g.nome.toLowerCase().includes(q) || g.ip.toLowerCase().includes(q) ||
      g.cameras.some(cn => cn.toLowerCase().includes(q)));
  }
  if(gravs.length === 0){
    grid.innerHTML = '<div class="grav-empty" style="grid-column:1/-1">Nenhum gravador encontrado</div>';
    return;
  }

  const forceExpand = gravSearch.trim().length > 0;
  grid.innerHTML = gravs.map(g => {
    let onCount = 0, offCount = 0;
    const camList = g.cameras.map((nome, idx) => {
      const cam = camMap[nome.toLowerCase()];
      const isOn = cam ? cam.s.toLowerCase()==='ok' : false;
      if(cam){ if(isOn) onCount++; else offCount++; }
      return { ch: idx + 1, nome, cam, isOn };
    });
    const tipoClass = g.tipo.toLowerCase();
    const iconTipo = g.tipo === 'NVR' ? 'fa-hdd' : g.tipo === 'DVR' ? 'fa-video' : 'fa-server';
    const isExpanded = forceExpand || gravExpanded[g.id] === true;
    return `<div class="grav-card ${isExpanded?'expanded':''}" data-grav-id="${g.id}">
      <div class="grav-header ${tipoClass}" onclick="toggleGravCard('${g.id}')">
        <div>
          <div class="grav-title">
            <i class="fas ${iconTipo}" style="color:${g.tipo==='NVR'?'var(--cyan2)':g.tipo==='DVR'?'var(--pink2)':'var(--blue2)'}"></i>
            ${escapeHtml(g.nome)}
            <span class="badge ${tipoClass}">${g.tipo}</span>
          </div>
          <div class="grav-subtitle">
            <span>📦 ${escapeHtml(g.modelo)}</span>
            <span>🌐 <code>${escapeHtml(g.ip)}</code> • 📍 ${escapeHtml(g.local)}</span>
          </div>
        </div>
        <i class="fas fa-chevron-down grav-chevron"></i>
      </div>
      <div class="grav-stats" onclick="toggleGravCard('${g.id}')">
        <div class="grav-stat"><div class="num">${g.canais}</div><div class="lbl">Canais</div></div>
        <div class="grav-stat ok"><div class="num">${onCount}</div><div class="lbl">Online</div></div>
        <div class="grav-stat bad"><div class="num">${offCount}</div><div class="lbl">Off-line</div></div>
      </div>
      <div class="grav-cams">
        ${camList.map(c => {
          const status = c.cam ? (c.isOn ? '<span class="status on">● Online</span>' : '<span class="status off">● Off-line</span>')
            : '<span class="status virtual">— Não catalogada</span>';
          return `<div class="grav-cam ${c.cam && !c.isOn ? 'off' : ''}">
            <span class="ch">CH${String(c.ch).padStart(2,'0')}</span>
            <span class="name">${escapeHtml(c.nome)}</span>
            <span class="ip">${c.cam && c.cam.ip ? escapeHtml(c.cam.ip) : '—'}</span>
            ${status}
          </div>`;
        }).join('')}
        <div class="grav-hint">👆 Clique no cabeçalho para recolher</div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('nav-grav-count').textContent = GRAVADORES.length;
}

function toggleGravCard(gravId){
  const card = document.querySelector(`.grav-card[data-grav-id="${gravId}"]`);
  if(!card) return;
  const isExpanded = card.classList.contains('expanded');
  if(isExpanded){ card.classList.remove('expanded'); gravExpanded[gravId] = false; }
  else { card.classList.add('expanded'); gravExpanded[gravId] = true; }
  try{ localStorage.setItem('cftv_grav_expanded', JSON.stringify(gravExpanded)); }catch(e){}
}

// ============================================================
// RENDER PRINCIPAL
// ============================================================
function render(){
  const total = cameras.length;
  const online = cameras.filter(c=>c.s.toLowerCase()==='ok').length;
  const offline = total - online;
  const ip = cameras.filter(c=>c.t==='IP').length;
  const analog = total - ip;
  const switches = EQUIPAMENTOS.filter(e=>e.tipo==='SW').length;
  const eol = EQUIPAMENTOS.filter(e=>e.status==='eol').length;
  const servidores = EQUIPAMENTOS.filter(e=>e.tipo==='SRV').length;
  const audit = auditar();

  document.getElementById('kpis').innerHTML = `
    <div class="kpi blue" onclick="setView('cameras');setFilter('all');render();">
      <div class="kpi-header"><span class="kpi-label">Total</span>
        <div class="kpi-icon"><i class="fas fa-video"></i></div></div>
      <div class="kpi-value">${total}</div><small>Câmeras cadastradas</small></div>
    <div class="kpi green" onclick="setView('cameras');setFilter('online');render();">
      <div class="kpi-header"><span class="kpi-label">Online</span>
        <div class="kpi-icon"><i class="fas fa-circle-check"></i></div></div>
      <div class="kpi-value">${online}</div><small>${((online/total)*100).toFixed(1)}% operacionais</small></div>
    <div class="kpi red" onclick="setView('cameras');setFilter('offline');render();">
      <div class="kpi-header"><span class="kpi-label">Off-line</span>
        <div class="kpi-icon"><i class="fas fa-triangle-exclamation"></i></div></div>
      <div class="kpi-value">${offline}</div><small>${((offline/total)*100).toFixed(1)}% com falha</small></div>
    <div class="kpi cyan" onclick="setView('equipamentos');">
      <div class="kpi-header"><span class="kpi-label">Switches</span>
        <div class="kpi-icon"><i class="fas fa-network-wired"></i></div></div>
      <div class="kpi-value">${switches}</div><small>${eol} em fim de vida</small></div>
    <div class="kpi amber" onclick="setView('equipamentos');">
      <div class="kpi-header"><span class="kpi-label">EOL</span>
        <div class="kpi-icon"><i class="fas fa-exclamation-triangle"></i></div></div>
      <div class="kpi-value">${eol}</div><small>Precisam trocar</small></div>
    <div class="kpi purple" onclick="setView('gravadores');">
      <div class="kpi-header"><span class="kpi-label">Gravadores</span>
        <div class="kpi-icon"><i class="fas fa-film"></i></div></div>
      <div class="kpi-value">${GRAVADORES.length}</div><small>DVRs + NVRs + Servidores</small></div>
    <div class="kpi red" onclick="setView('auditoria');">
      <div class="kpi-header"><span class="kpi-label">Problemas</span>
        <div class="kpi-icon"><i class="fas fa-bug"></i></div></div>
      <div class="kpi-value">${audit.totalProblemas}</div><small>Ver auditoria</small></div>
  `;

  document.getElementById('nav-cam-count').textContent = total;
  document.getElementById('nav-equip-count').textContent = EQUIPAMENTOS.length;
  document.getElementById('nav-audit-count').textContent = audit.totalProblemas;
  document.getElementById('nav-grav-count').textContent = GRAVADORES.length;

  // TABELA CÂMERAS
  const filtered = getFiltered();
  const tbody = document.getElementById('tbody');
  if(filtered.length === 0){
    tbody.innerHTML = '<tr><td colspan="9" class="empty">Nenhuma câmera encontrada</td></tr>';
  } else {
    tbody.innerHTML = filtered.map(c => {
      const isOn = c.s.toLowerCase()==='ok';
      const h = durH(c.statusSince);
      let cls = 'offtime';
      if(h>72) cls += ' critical'; else if(h>24) cls += ' long';
      const isCritical = !isOn && h > 24;
      return `<tr class="${isCritical?'row-alert':''}">
        <td><div class="toggle ${isOn?'on':''}" onclick="toggleCamera(${c.id})"></div></td>
        <td style="font-weight:600">${escapeHtml(c.n)}</td>
        <td><span class="badge ${c.t==='IP'?'ip':'analog'}">${c.t}</span></td>
        <td>${c.p?'<span class="piso">'+escapeHtml(c.p)+'</span>':'—'}</td>
        <td class="info-cell">${escapeHtml(c.local||'—')}</td>
        <td class="info-cell">${escapeHtml(c.ip||'—')}</td>
        <td><span class="badge ${isOn?'ok':'bad'}">${isOn?'● Online':'● Off-line'}</span></td>
        <td class="info-cell">${isOn?'—':fmtDT(c.statusSince)}</td>
        <td class="${isOn?'info-cell':cls}">${isOn?'—':timeAgo(c.statusSince)}</td>
      </tr>`;
    }).join('');
  }

  // EQUIPAMENTOS
  const locais = {};
  EQUIPAMENTOS.forEach(e => { (locais[e.local] = locais[e.local] || []).push(e); });
  const camPorLocal = {};
  cameras.forEach(c => {
    const loc = c.local || 'Sem local';
    if(!camPorLocal[loc]) camPorLocal[loc] = {total:0, online:0, offline:0};
    camPorLocal[loc].total++;
    if(c.s.toLowerCase()==='ok') camPorLocal[loc].online++;
    else camPorLocal[loc].offline++;
  });
  const iconTipo = t => t==='SW'?'fa-network-wired':t==='DVR'?'fa-video':t==='NVR'?'fa-hdd':t==='NOB'?'fa-battery-full':t==='SRV'?'fa-server':t==='MON'?'fa-tv':'fa-microchip';
  const nomeTipo = t => t==='SW'?'Switch':t==='DVR'?'DVR':t==='NVR'?'NVR':t==='NOB'?'Nobreak':t==='SRV'?'Servidor':t==='MON'?'Monitor':'Equip';
  const andarDe = local => {
    if(["Central de Segurança","Sala TI","Sala da Diretoria","Sala da Gerência","Portaria de Serviço"].includes(local)) return "Piso L";
    if(local === "Sala Rio de Janeiro") return "Piso C";
    if(local === "Shaft 1º Andar") return "1º Andar";
    if(local === "Shaft 10º Andar") return "10º Andar";
    if(local === "3SUB2") return "Subsolo 1";
    return "Outros";
  };
  const locaisOrdenados = Object.keys(locais).sort((a, b) => {
    const ia = ORDEM_LOCAIS.indexOf(a), ib = ORDEM_LOCAIS.indexOf(b);
    if(ia === -1 && ib === -1) return a.localeCompare(b);
    if(ia === -1) return 1; if(ib === -1) return -1;
    return ia - ib;
  });
  let htmlEquip = '', andarAtual = '';
  locaisOrdenados.forEach(local => {
    const andar = andarDe(local);
    if(andar !== andarAtual){
      andarAtual = andar;
      htmlEquip += `<div style="grid-column:1/-1;margin-top:${htmlEquip?'20px':'0'};margin-bottom:6px;padding:14px 20px;background:linear-gradient(135deg,rgba(59,130,246,.15),rgba(139,92,246,.1));border-radius:12px;border-left:4px solid var(--blue);font-weight:800;font-size:1rem;color:var(--blue2);letter-spacing:.05em">🏢 ${andar}</div>`;
    }
    const equips = locais[local];
    const eolLocal = equips.filter(e=>e.status==='eol').length;
    const cams = camPorLocal[local] || {total:0, online:0, offline:0};
    htmlEquip += `<div class="local-card">
      <div class="local-header">
        <div class="local-title">📍 ${escapeHtml(local)}</div>
        <div style="display:flex;gap:8px;align-items:center">
          ${cams.total>0?'<span class="local-count">🎥 '+cams.total+'</span>':''}
          ${eolLocal>0?'<span class="badge eol">⚠ '+eolLocal+' EOL</span>':''}
        </div>
      </div>
      <div class="local-body">
        ${cams.total>0 ? `<div class="local-stats">
          <div class="stat-box"><div class="num">${cams.total}</div><div class="lbl">Câmeras</div></div>
          <div class="stat-box ok"><div class="num">${cams.online}</div><div class="lbl">Online</div></div>
          <div class="stat-box bad"><div class="num">${cams.offline}</div><div class="lbl">Off-line</div></div>
          <div class="stat-box"><div class="num">${equips.length}</div><div class="lbl">Equip.</div></div>
        </div>` : ''}
        <div class="equip-list">
          ${equips.map(e => `<div class="equip-item ${e.tipo.toLowerCase()} ${e.status==='eol'?'eol':''}">
            <div class="equip-icon"><i class="fas ${iconTipo(e.tipo)}"></i></div>
            <div class="equip-info">
              <div class="equip-name">${escapeHtml(e.nome)}${e.qtd?' <span style="color:var(--text3)">(x'+e.qtd+')</span>':''}</div>
              <div class="equip-meta"><span>📦 ${escapeHtml(e.modelo)}</span>
                ${e.obs?'<span style="color:#fca5a5">⚠ '+escapeHtml(e.obs)+'</span>':''}</div>
            </div>
            <span class="equip-tag ${e.tipo.toLowerCase()}">${nomeTipo(e.tipo)}</span>
          </div>`).join('')}
        </div>
      </div>
    </div>`;
  });
  document.getElementById('equipGrid').innerHTML = htmlEquip;

  renderAuditoria(audit);
  renderGravadores();
  document.getElementById('totalCount').textContent = total;
  document.getElementById('offCount').textContent = offline;
  document.getElementById('equipCount').textContent = EQUIPAMENTOS.length;
}

function renderAuditoria(a){
  const grid = document.getElementById('auditGrid');
  const card = (color, title, items, renderItem) => `
    <div class="audit-card">
      <div class="audit-header ${color}"><div class="audit-title">${title}</div><div class="audit-count">${items.length}</div></div>
      <div class="audit-body">${items.length===0 ? '<div class="audit-empty">✅ Nenhum problema</div>' : items.map(renderItem).join('')}</div>
    </div>`;
  grid.innerHTML =
    card('red','🔴 IPs Duplicados', a.ipsDuplicados, ([ip, cams]) => `
      <div class="audit-item red">
        <div class="audit-item-title">🌐 ${escapeHtml(ip)} <span class="badge dup">${cams.length}x</span></div>
        <div class="audit-item-detail">${cams.map(c=>`<span>• ${escapeHtml(c.n)} <span style="color:var(--text4)">(${escapeHtml(c.p||'—')} • ${escapeHtml(c.local||'—')})</span></span>`).join('')}</div>
      </div>`)
    + card('red','🔴 IPs Inválidos', a.ipsInvalidos, c => `
      <div class="audit-item red">
        <div class="audit-item-title">⚠️ ${escapeHtml(c.n)}</div>
        <div class="audit-item-detail"><span>IP: <b style="color:#fca5a5">${escapeHtml(c.ip)}</b></span></div>
      </div>`)
    + card('amber','⚠️ Nomes Similares', a.nomesDuplicados, ([norm, cams]) => `
      <div class="audit-item amber">
        <div class="audit-item-title">📛 ${cams.length} câmeras parecidas</div>
        <div class="audit-item-detail">${cams.map(c=>`<span>• ${escapeHtml(c.n)} <span style="color:var(--text4)">(IP: ${escapeHtml(c.ip||'—')})</span></span>`).join('')}</div>
      </div>`)
    + card('blue','📋 Sem IP', a.semIP, c => `<div class="audit-item"><div class="audit-item-title">${escapeHtml(c.n)}</div><div class="audit-item-detail"><span>Tipo: ${c.t} • Piso: ${escapeHtml(c.p||'—')}</span></div></div>`)
    + card('blue','📋 Sem Piso', a.semPiso, c => `<div class="audit-item"><div class="audit-item-title">${escapeHtml(c.n)}</div><div class="audit-item-detail"><span>Local: ${escapeHtml(c.local||'—')}</span></div></div>`)
    + card('blue','📋 Sem Local', a.semLocal, c => `<div class="audit-item"><div class="audit-item-title">${escapeHtml(c.n)}</div><div class="audit-item-detail"><span>Piso: ${escapeHtml(c.p||'—')}</span></div></div>`);
}

// ============================================================
// GRÁFICOS
// ============================================================
function renderCharts(){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  Chart.defaults.color = isDark ? '#94a3b8' : '#475569';
  Chart.defaults.font.family = "'Inter', 'Segoe UI', sans-serif";
  Chart.defaults.font.size = 11;

  const total = cameras.length;
  const online = cameras.filter(c=>c.s.toLowerCase()==='ok').length;
  const offline = total - online;
  const ip = cameras.filter(c=>c.t==='IP').length;
  const analog = total - ip;

  // Status doughnut
  if(charts.status) charts.status.destroy();
  charts.status = new Chart(document.getElementById('chartStatus'), {
    type:'doughnut',
    data:{
      labels:['Online','Off-line'],
      datasets:[{
        data:[online,offline],
        backgroundColor:['#22c55e','#ef4444'],
        borderColor: isDark ? '#0f172a' : '#fff',
        borderWidth:4, hoverOffset:10
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false, cutout:'68%',
      plugins:{
        legend:{position:'bottom', labels:{padding:14,usePointStyle:true,pointStyle:'circle'}},
        tooltip:{
          backgroundColor:'#1e293b', padding:12, cornerRadius:10,
          callbacks:{label: ctx => ` ${ctx.label}: ${ctx.raw} (${((ctx.raw/total)*100).toFixed(1)}%)`}
        }
      }
    }
  });

  // Tipo doughnut
  if(charts.tipo) charts.tipo.destroy();
  charts.tipo = new Chart(document.getElementById('chartTipo'), {
    type:'doughnut',
    data:{
      labels:['IP','Analógica'],
      datasets:[{
        data:[ip,analog],
        backgroundColor:['#3b82f6','#f59e0b'],
        borderColor: isDark ? '#0f172a' : '#fff',
        borderWidth:4, hoverOffset:10
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false, cutout:'68%',
      plugins:{
        legend:{position:'bottom', labels:{padding:14,usePointStyle:true,pointStyle:'circle'}},
        tooltip:{
          backgroundColor:'#1e293b', padding:12, cornerRadius:10,
          callbacks:{label: ctx => ` ${ctx.label}: ${ctx.raw} (${((ctx.raw/total)*100).toFixed(1)}%)`}
        }
      }
    }
  });

  // Piso barras
  const porPiso = {};
  cameras.forEach(c => {
    const p = c.p || 'Sem piso';
    if(!porPiso[p]) porPiso[p] = {total:0, online:0, offline:0};
    porPiso[p].total++;
    if(c.s.toLowerCase()==='ok') porPiso[p].online++;
    else porPiso[p].offline++;
  });
  const topPisos = Object.entries(porPiso).sort((a,b)=>b[1].total-a[1].total).slice(0,7);
  if(charts.piso) charts.piso.destroy();
  charts.piso = new Chart(document.getElementById('chartPiso'), {
    type:'bar',
    data:{
      labels: topPisos.map(([p])=>p),
      datasets:[
        {label:'Online', data: topPisos.map(([,d])=>d.online), backgroundColor:'#22c55e', borderRadius:6, stack:'s'},
        {label:'Off-line', data: topPisos.map(([,d])=>d.offline), backgroundColor:'#ef4444', borderRadius:6, stack:'s'}
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false, indexAxis:'y',
      scales:{
        x:{stacked:true, grid:{color: isDark ? 'rgba(148,163,184,.08)' : 'rgba(15,23,42,.08)'}},
        y:{stacked:true, grid:{display:false}}
      },
      plugins:{
        legend:{position:'bottom', labels:{padding:14,usePointStyle:true,pointStyle:'circle'}}
      }
    }
  });

  // EOL
  const eolData = {
    labels:['Switches EOL','DVRs','NVRs','Servidores','Nobreaks'],
    datasets:[{
      data:[
        EQUIPAMENTOS.filter(e=>e.status==='eol').length,
        EQUIPAMENTOS.filter(e=>e.tipo==='DVR').length,
        EQUIPAMENTOS.filter(e=>e.tipo==='NVR').length,
        EQUIPAMENTOS.filter(e=>e.tipo==='SRV').length,
        EQUIPAMENTOS.filter(e=>e.tipo==='NOB').length
      ],
      backgroundColor:['#ef4444','#ec4899','#06b6d4','#3b82f6','#f59e0b'],
      borderRadius:8
    }]
  };
  if(charts.eol) charts.eol.destroy();
  charts.eol = new Chart(document.getElementById('chartEOL'), {
    type:'bar',
    data: eolData,
    options:{
      responsive:true, maintainAspectRatio:false,
      scales:{y:{beginAtZero:true, ticks:{stepSize:1}, grid:{color: isDark ? 'rgba(148,163,184,.08)' : 'rgba(15,23,42,.08)'}},
        x:{grid:{display:false}}},
      plugins:{legend:{display:false}}
    }
  });
}

// ============================================================
// INICIALIZAÇÃO
// ============================================================
async function init(){
  await carregarDoGitHub();
  const floors = [...new Set(cameras.map(c=>c.p||'Sem piso'))].sort();
  const sel = document.getElementById('floorFilter');
  sel.innerHTML = '<option value="all">Todos os pisos</option>';
  floors.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f; opt.textContent = f;
    sel.appendChild(opt);
  });
  sel.onchange = e => { floorFilter = e.target.value; render(); };
  document.getElementById('search').oninput = e => { search = e.target.value; render(); };
  document.getElementById('gravSearch').oninput = e => { gravSearch = e.target.value; renderGravadores(); };

  // Relógio
  function atualizaRelogio(){ document.getElementById('clock').textContent = new Date().toLocaleTimeString('pt-BR'); }
  atualizaRelogio();
  setInterval(atualizaRelogio, 1000);
  setInterval(render, 30000);
  render();
}

// ============================================================
// ATALHOS DE TECLADO
// ============================================================
document.addEventListener('keydown', e => {
  // Ctrl+K → busca
  if((e.ctrlKey || e.metaKey) && e.key === 'k'){
    e.preventDefault();
    setView('cameras');
    setTimeout(() => document.getElementById('search').focus(), 100);
    const hint = document.getElementById('shortcutHint');
    hint.classList.add('show');
    setTimeout(() => hint.classList.remove('show'), 1500);
  }
  // Esc → limpa busca
  if(e.key === 'Escape'){
    document.getElementById('search').value = '';
    document.getElementById('gravSearch').value = '';
    search = ''; gravSearch = '';
    render();
    renderGravadores();
  }
});

init();
</script>
